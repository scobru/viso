[package]
name = "viso-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library for Viso - decentralized identity platform on Freenet"

[dependencies]
ciborium.workspace = true
serde.workspace = true
serde_bytes.workspace = true
ed25519-dalek.workspace = true
blake3.workspace = true
bs58.workspace = true
data-encoding.workspace = true
freenet-stdlib.workspace = true
# Optional: pulls RSA. Contract/delegate WASM builds leave it off.
ghostkey_lib = { version = "0.2", optional = true }

[features]
ghostkey = ["dep:ghostkey_lib"]

[dev-dependencies]
rand.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
