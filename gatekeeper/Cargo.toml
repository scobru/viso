[package]
name = "viso-gatekeeper"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Blind RSA OAuth Gatekeeper for Viso anonymous Proof-of-Personhood"

[dependencies]
viso-core = { workspace = true, features = ["poh"] }
blind-rsa-signatures.workspace = true
base64.workspace = true
data-encoding.workspace = true
rand.workspace = true
serde.workspace = true
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hmac-sha256 = "1.1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
