[package]
name = "viso-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fetch Viso identities (avatar, profile, persona level) from Freenet, verified client-side"

[dependencies]
viso-core = { workspace = true, features = ["ghostkey"] }
viso-ante.workspace = true
freenet-stdlib = { workspace = true, features = ["net"] }
ciborium.workspace = true
ed25519-dalek.workspace = true
bs58.workspace = true
data-encoding.workspace = true
thiserror = "2"
tokio = { version = "1", features = ["rt", "macros", "time", "net"] }
tokio-tungstenite = "0.27"

[dev-dependencies]
rand.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core"] }
